<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}My App{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; flex-direction: column; }

    /* Nav */
    nav { background: #fff; border-bottom: 1px solid #e8eaed; padding: 0 32px; height: 56px; display: flex; align-items: center; gap: 32px; }
    nav .brand { font-weight: 700; font-size: 16px; color: #1a1a1a; text-decoration: none; }
    nav a { font-size: 14px; color: #555; text-decoration: none; }
    nav a:hover { color: #4285f4; }
    nav .spacer { flex: 1; }
    nav .badge { font-size: 12px; background: #e8f0fe; color: #4285f4; border-radius: 12px; padding: 3px 10px; font-weight: 600; }
    nav .lock { font-size: 12px; color: #999; }
    .btn { display: inline-block; padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; text-decoration: none; cursor: pointer; border: none; }
    .btn-primary { background: #4285f4; color: #fff; }
    .btn-outline { background: transparent; color: #4285f4; border: 1px solid #4285f4; }
    .btn:hover { opacity: .88; }

    /* Main */
    main { flex: 1; padding: 40px 32px; max-width: 960px; margin: 0 auto; width: 100%; }

    /* Cards */
    .card { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.08); padding: 32px; margin-bottom: 24px; }
    .card h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .card p  { color: #555; font-size: 14px; line-height: 1.6; }

    /* Flash / info */
    .info-box { background: #e8f0fe; border-left: 4px solid #4285f4; border-radius: 8px; padding: 14px 18px; font-size: 14px; color: #333; margin-bottom: 20px; }
  </style>
</head>
<body>

<nav>
  <a href="/" class="brand">My App</a>
  <a href="/">Home</a>
  <a href="/about">About <span class="lock">🔓</span></a>
  <a href="/dashboard">Dashboard <span class="lock">🔒</span></a>
  <a href="/profile">Profile <span class="lock">🔒</span></a>
  <div class="spacer"></div>
  {% if user %}
    <span class="badge">{{ user.get('name', user.get('preferred_username', 'User')) }}</span>
    <a href="/logout" class="btn btn-outline">Sign out</a>
  {% else %}
    <a href="/login" class="btn btn-primary">Sign in</a>
  {% endif %}
</nav>

<main>
  {% block content %}{% endblock %}
</main>

</body>
</html>
